name: Diagnose BMW Data Flow

on:
  push:
    paths:
      - ".github/workflows/diagnose-data.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query recent D1 data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== bmw_daily latest 10 ==="
          npx wrangler@latest d1 execute bmw-vehicle-data --remote --command "SELECT snapshot_date,snapshot_timestamp,mileage_start_km,mileage_km,daily_distance_km,fuel_percent,range_km,updated_at FROM bmw_daily ORDER BY snapshot_date DESC LIMIT 10;" --json
          echo "=== raw latest timestamps ==="
          npx wrangler@latest d1 execute bmw-vehicle-data --remote --command "SELECT snapshot_timestamp,COUNT(*) AS rows FROM bmw_raw_daily GROUP BY snapshot_timestamp ORDER BY snapshot_timestamp DESC LIMIT 12;" --json
          echo "=== cardata latest travel rows ==="
          npx wrangler@latest d1 execute bmw-vehicle-data --remote --command "SELECT c_timestamp,travelled_distance FROM bmw_cardata_raw ORDER BY c_timestamp DESC LIMIT 12;" --json
          echo "=== entity ingestion latest seen ==="
          npx wrangler@latest d1 execute bmw-vehicle-data --remote --command "SELECT MAX(last_seen) AS latest_seen, COUNT(*) AS entities FROM bmw_entities;" --json
