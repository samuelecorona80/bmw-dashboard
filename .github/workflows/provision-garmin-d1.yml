name: Provision Garmin D1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/provision-garmin-d1.yml"
  workflow_dispatch:

concurrency:
  group: garmin-d1-provision
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Cloudflare secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Find or create Garmin D1
        run: |
          set -euo pipefail
          DB_NAME="garmin-health-data"

          npx wrangler@latest d1 list --json > /tmp/d1-before.json
          EXISTING_ID=$(python - <<'PY'
          import json
          rows=json.load(open("/tmp/d1-before.json"))
          m=next((r for r in rows if r.get("name")=="garmin-health-data"), None)
          print((m or {}).get("uuid") or (m or {}).get("id") or "")
          PY
          )

          if [ -n "$EXISTING_ID" ]; then
            echo "Garmin D1 already exists: $EXISTING_ID"
            exit 0
          fi

          echo "Creating D1 database $DB_NAME..."
          npx wrangler@latest d1 create "$DB_NAME"

          npx wrangler@latest d1 list --json > /tmp/d1-after.json
          python - <<'PY'
          import json
          rows=json.load(open("/tmp/d1-after.json"))
          m=next((r for r in rows if r.get("name")=="garmin-health-data"), None)
          if not m:
              raise SystemExit("garmin-health-data not found after create")
          dbid=m.get("uuid") or m.get("id")
          if not dbid:
              raise SystemExit("garmin-health-data id missing")
          print(f"Created Garmin D1: {dbid}")
          PY
