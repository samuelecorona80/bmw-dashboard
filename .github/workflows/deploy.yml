name: Deploy BMW Dashboard

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wrangler.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: bmw-dashboard-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$CLOUDFLARE_D1_DATABASE_ID" || (echo "Missing CLOUDFLARE_D1_DATABASE_ID" && exit 1)

      - name: Inject D1 database id
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          python - <<'PY'
          import os, re, pathlib
          p = pathlib.Path("wrangler.toml")
          s = p.read_text()
          dbid = os.environ["CLOUDFLARE_D1_DATABASE_ID"]
          s = re.sub(r'database_id\s*=\s*"[^"]*"', f'database_id = "{dbid}"', s)
          p.write_text(s)
          PY

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify production endpoint
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://bmw.samuelecorona.it/api/data > /tmp/bmw.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/bmw.json"))
          assert "core" in d, "Production API did not return dashboard payload"
          print("Production API OK")
          PY
